name: Format rate-limit fix

on:
  push:
    branches:
      - fix/community-rate-limit-backoff

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'STYLE: format rate-limit fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/community-rate-limit-backoff
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format target file
        run: pnpm prettier javascripts/discourse/api-initializers/crimson-channels.js --write

      - name: Commit formatting if needed
        run: |
          if git diff --quiet -- javascripts/discourse/api-initializers/crimson-channels.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add javascripts/discourse/api-initializers/crimson-channels.js
          git commit -m "STYLE: format rate-limit fix"
          git push origin HEAD:fix/community-rate-limit-backoff
