name: Bootstrap import

on:
  push:
    branches:
      - bootstrap-import
    paths:
      - ".bootstrap/ready"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct prepared repository
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* | base64 --decode > /tmp/crimson-bootstrap.tgz
          echo "872bf1611f444875ca379fc589b87bf86e4901cc7070910d750c50176785682b  /tmp/crimson-bootstrap.tgz" | sha256sum --check -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          tar -xzf /tmp/crimson-bootstrap.tgz -C .
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "CHORE: import Crimson Channels theme and minimum-token context"
          git push origin HEAD:bootstrap-import
