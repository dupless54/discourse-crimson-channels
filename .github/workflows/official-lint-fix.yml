name: Official lint fix

on:
  push:
    branches:
      - bootstrap-import
    paths:
      - ".lint-fix/ready"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap-import
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply official formatting fixes
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm lint:css:fix
          pnpm lint:prettier:fix
          pnpm lint:css
          pnpm lint:prettier
          pnpm lint:js --max-warnings 0
          rm -rf .lint-fix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "STYLE: apply official Discourse lint formatting"
          git push origin HEAD:bootstrap-import
