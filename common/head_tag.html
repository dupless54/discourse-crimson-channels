<style id="cn-native-topic-feed">
  :root {
    --cn-native-row: color-mix(
      in srgb,
      var(--secondary) 94%,
      var(--primary) 6%
    );
    --cn-native-row-hover: color-mix(
      in srgb,
      var(--secondary) 90%,
      var(--primary) 10%
    );
    --cn-native-border: color-mix(
      in srgb,
      var(--primary) 11%,
      transparent
    );
    --cn-native-meta: color-mix(
      in srgb,
      var(--primary) 7%,
      transparent
    );
  }

  @media (width >= 700px) {
    body:not(.admin-interface)
      #main-outlet
      :is(.list-container, .topic-list-container)
      .topic-list {
      width: 100%;
      table-layout: auto;
      border-collapse: separate;
      border-spacing: 0 5px;
      background: transparent;
    }

    body:not(.admin-interface)
      #main-outlet
      :is(.list-container, .topic-list-container)
      .topic-list-header
      th {
      padding-block: 4px 8px;
      color: var(--primary-medium);
      background: transparent;
      border: 0;
      font-size: var(--font-down-2, 0.76rem);
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    body:not(.admin-interface)
      #main-outlet
      :is(.list-container, .topic-list-container)
      .topic-list-item:not(.topic-list-item-separator)
      > td {
      box-sizing: border-box;
      padding-block: 12px;
      background: var(--cn-native-row);
      border-block: 1px solid var(--cn-native-border);
      transition:
        background-color 140ms ease,
        border-color 140ms ease;
    }

    body:not(.admin-interface)
      #main-outlet
      :is(.list-container, .topic-list-container)
      .topic-list-item:not(.topic-list-item-separator)
      > td:first-child {
      border-inline-start: 1px solid var(--cn-native-border);
      border-start-start-radius: var(--cn-radius-sm);
      border-end-start-radius: var(--cn-radius-sm);
    }

    body:not(.admin-interface)
      #main-outlet
      :is(.list-container, .topic-list-container)
      .topic-list-item:not(.topic-list-item-separator)
      > td:last-child {
      border-inline-end: 1px solid var(--cn-native-border);
      border-start-end-radius: var(--cn-radius-sm);
      border-end-end-radius: var(--cn-radius-sm);
    }

    body:not(.admin-interface)
      #main-outlet
      :is(.list-container, .topic-list-container)
      .topic-list-item:not(.topic-list-item-separator):is(:hover, :focus-within)
      > td {
      background: var(--cn-native-row-hover);
      border-color: color-mix(in srgb, var(--tertiary) 24%, transparent);
    }

    body:not(.admin-interface)
      #main-outlet
      :is(.list-container, .topic-list-container)
      .topic-list-item.pinned:not(.topic-list-item-separator)
      > td {
      background: color-mix(
        in srgb,
        var(--cn-native-row) 92%,
        var(--cn-crimson) 8%
      );
    }

    .cn-topic-cell {
      position: relative;
      min-width: 0;
      padding: 12px 16px 12px 14px !important;
      vertical-align: middle;
    }

    .cn-topic-cell__rail {
      position: absolute;
      inset-block: 8px;
      inset-inline-start: 0;
      width: 0;
      border-inline-start: 3px solid var(--cn-crimson);
      border-radius: 999px;
      pointer-events: none;
    }

    .topic-list-item.pinned .cn-topic-cell__rail,
    .topic-list-item.pinned-globally .cn-topic-cell__rail {
      border-inline-start-width: 4px;
      border-color: var(--cn-crimson) !important;
      box-shadow: 0 0 12px color-mix(in srgb, var(--cn-crimson) 28%, transparent);
    }

    .cn-topic-cell__layout {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      min-width: 0;
    }

    .cn-topic-cell__author {
      display: inline-flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      border-radius: 50%;
      outline: 1px solid color-mix(in srgb, var(--primary) 10%, transparent);
      outline-offset: 2px;
    }

    .cn-topic-cell__author img.avatar {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 50%;
    }

    .cn-topic-cell__content {
      min-width: 0;
    }

    .cn-topic-cell .link-top-line {
      display: block;
      min-width: 0;
      line-height: 1.3;
    }

    .cn-topic-cell .link-top-line a.title {
      color: var(--primary-high);
      font-size: var(--font-up-1, 1rem);
      font-weight: 680;
      text-wrap: pretty;
    }

    .cn-topic-cell .link-top-line a.title:is(:hover, :focus-visible) {
      color: var(--tertiary);
    }

    .cn-topic-cell .link-bottom-line {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .cn-topic-cell .badge-category__wrapper {
      max-width: 100%;
      padding: 2px 7px;
      background: var(--cn-native-meta);
      border: 1px solid var(--cn-native-border);
      border-radius: 999px;
    }

    .cn-topic-cell a.discourse-tag {
      display: inline-flex;
      min-height: 20px;
      align-items: center;
      box-sizing: border-box;
      padding: 2px 7px !important;
      color: var(--primary-medium) !important;
      background: color-mix(in srgb, var(--primary) 5%, transparent);
      border: 1px solid var(--cn-native-border);
      border-radius: 999px;
      font-size: var(--font-down-2, 0.74rem);
      line-height: 1.15;
    }

    .cn-topic-cell :is(.topic-excerpt, .post-excerpt) {
      display: -webkit-box;
      max-width: 76ch;
      margin: 6px 0 0;
      overflow: hidden;
      color: var(--primary-medium);
      font-size: var(--font-down-1, 0.86rem);
      line-height: 1.4;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1;
    }

    .cn-topic-rich-preview {
      display: grid !important;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      max-width: 72ch;
      margin-top: 6px;
      padding: 0 !important;
      background: transparent !important;
      border: 0 !important;
    }

    .cn-topic-rich-preview--text-only {
      display: block !important;
    }

    .cn-topic-rich-preview__excerpt {
      min-width: 0;
      margin: 0 !important;
      overflow: hidden;
      color: var(--primary-medium);
      font-size: var(--font-down-1, 0.84rem);
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cn-topic-rich-preview__media {
      grid-column: 2;
      width: 112px !important;
      min-width: 112px !important;
      max-width: 112px !important;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: var(--primary-very-low);
      border: 1px solid var(--cn-native-border);
      border-radius: var(--cn-radius-xs);
    }

    .cn-topic-rich-preview__media img {
      display: block;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
    }

    body:not(.admin-interface)
      #main-outlet
      :is(.list-container, .topic-list-container)
      .topic-list
      td.num {
      width: 72px;
      min-width: 72px;
      padding-inline: 8px !important;
      color: var(--primary-medium);
      font-size: var(--font-down-1, 0.84rem);
      font-variant-numeric: tabular-nums;
      text-align: center;
      vertical-align: middle;
    }

    body:not(.admin-interface)
      #main-outlet
      :is(.list-container, .topic-list-container)
      .topic-list
      td.activity {
      width: 96px;
      min-width: 96px;
    }

    body:not(.admin-interface)
      #main-outlet
      :is(.list-container, .topic-list-container)
      .topic-list
      td.num
      a {
      color: inherit;
    }

    body:not(.admin-interface)
      #main-outlet
      :is(.list-container, .topic-list-container)
      .topic-list-item:is(.unseen-topic, .unread-posts)
      .cn-topic-cell
      .link-top-line
      a.title {
      color: var(--primary);
      font-weight: 720;
    }

    @media (width < 1000px) {
      .cn-topic-cell__layout {
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 9px;
      }

      .cn-topic-cell__author,
      .cn-topic-cell__author img.avatar {
        width: 34px;
        height: 34px;
      }

      .cn-topic-rich-preview__media {
        width: 96px !important;
        min-width: 96px !important;
        max-width: 96px !important;
      }

      body:not(.admin-interface)
        #main-outlet
        :is(.list-container, .topic-list-container)
        .topic-list
        td.num {
        width: 60px;
        min-width: 60px;
      }

      body:not(.admin-interface)
        #main-outlet
        :is(.list-container, .topic-list-container)
        .topic-list
        td.activity {
        width: 82px;
        min-width: 82px;
      }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    body:not(.admin-interface)
      #main-outlet
      :is(.list-container, .topic-list-container)
      .topic-list-item:not(.topic-list-item-separator)
      > td {
      transition: none;
    }
  }
</style>
