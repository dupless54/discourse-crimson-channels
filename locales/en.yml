en:
  theme_metadata:
    description: "A Discord-inspired Discourse theme for senin.me with a calm blue-violet visual system."
    settings:
      brand_initial: "Short text displayed in the community rail brand button."
      member_panel_title: "Heading shown above the online-member rail on regular pages."
      member_rail_enabled: "Show the right member rail on wide screens."
      member_rail_limit: "Maximum number of online members to display."
      forum_width_percent: "Desktop forum content width (40–100%)."
      visual_surface_style: "Surface hierarchy preset: balanced keeps a calm modern look, flat reduces decorative depth, and glass increases translucent separation without replacing native Discourse surfaces."
      visual_accent_color: "Primary blue accent as a 3- or 6-digit hex color. Colors that do not keep sufficient contrast with white action text fall back to the safe default blue."
      visual_secondary_accent_color: "Secondary violet accent as a 3- or 6-digit hex color. It is blended with the primary accent for gradients, rails, and selected states."
      visual_panel_opacity_percent: "Opacity used by the main panel surfaces (72–100%). Higher values are calmer and easier to read."
      visual_border_intensity_percent: "Strength of blue-violet accent and neutral borders (20–70%)."
      visual_glow_intensity_percent: "Amount of blue-violet glow used by shared elevated surfaces (0 disables accent glow)."
      visual_corner_style: "Global corner-radius preset: compact, soft, or rounded."
      member_hover_card_enabled: "Automatically open a user card after hovering a forum avatar or username."
      member_hover_card_delay_seconds: "Delay before automatically opening the hovered user card (seconds)."
      recent_profiles_enabled: "Show the members who most recently visited the viewed profile."
      recent_profiles_title: "Heading used by the right rail while showing profile visitors."
      recent_profiles_limit: "Maximum number of profile visitors to display."
      featured_topic_lists:
        description: "Add separate topic sections shown only on the homepage. Create as many as needed, reorder them, and place each section above or below the main topic list."
        schema:
          properties:
            enabled:
              label: "Enabled"
              description: "Show this topic section."
            title:
              label: "Section title"
              description: "SEÇİLİ KONULAR is used when left blank."
            category_ids:
              label: "Category"
              description: "Select the single category used by this section."
            position:
              label: "Position"
              description: "Choose above or below the main topic list."
            limit:
              label: "Topic count"
              description: "Number of topics shown in this section (1–20)."
      navigation_items:
        description: "Configure, reorder, and restrict the Crimson quick-navigation rail. URLs are limited to this Discourse site for a safe upgrade path."
        schema:
          properties:
            enabled:
              label: "Enabled"
              description: "Show this navigation item."
            label:
              label: "Label"
              description: "Accessible label and hover text shown for the item. This also names the item in the editor."
            url:
              label: "Destination"
              description: "Same-site Discourse path or URL, for example /latest."
            icon:
              label: "Icon"
              description: "Choose an icon from Discourse's supported icon picker."
            style:
              label: "Style"
              description: "Brand is intended for the first/home item; standard is used for normal shortcuts."
            visibility:
              label: "Visibility"
              description: "Show the item to everyone or only to members of selected groups."
            groups:
              label: "Allowed groups"
              description: "Used only when visibility is set to groups."
            mobile_shortcut:
              label: "Mobile header shortcut"
              description: "Use this item as the compact mobile header shortcut. The first enabled match wins."
      channel_sections:
        description: "Build Discord-like channel groups inside Discourse's native sidebar. Sections and channels can be reordered and restricted by group. Channel destinations must stay on this Discourse site."
        schema:
          properties:
            enabled:
              label: "Enabled"
              description: "Show this channel section."
            title:
              label: "Section title"
              description: "Heading shown in the native Discourse sidebar. This also names the section in the editor."
            collapsed_by_default:
              label: "Collapsed by default"
              description: "Start this section collapsed until the visitor changes its saved sidebar state."
            visibility:
              label: "Visibility"
              description: "Show this section to everyone or only to members of selected groups."
            groups:
              label: "Allowed groups"
              description: "Used only when section visibility is set to groups."
            channels:
              enabled:
                label: "Enabled"
                description: "Show this channel link."
              label:
                label: "Channel label"
                description: "Text shown for the channel in the sidebar. This also names the channel in the editor."
              url:
                label: "Destination"
                description: "Same-site Discourse path or URL, for example /latest or /c/community/5."
              icon:
                label: "Icon"
                description: "Choose the native Discourse icon displayed before the channel label."
              visibility:
                label: "Visibility"
                description: "Show this channel to everyone or only to members of selected groups."
              groups:
                label: "Allowed groups"
                description: "Used only when channel visibility is set to groups."
              badge_text:
                label: "Badge text"
                description: "Optional short badge displayed at the end of the channel row, for example NEW."
      featured_topics_enabled: "Enable the legacy single list. Used only while the new multi-list setting is empty."
      featured_category_url: "Category path used by the legacy single list."
      featured_topics_title: "Heading used by the legacy single list."
      featured_topics_position: "Position of the legacy single list: above or below."
      featured_topics_limit: "Maximum number of topics in the legacy single list."
      home_url: "Legacy home destination retained for migration compatibility."
      categories_url: "Legacy categories destination retained for migration compatibility."
      latest_url: "Legacy latest-topics destination retained for migration compatibility."
      servers_url: "Legacy private-server destination retained for migration compatibility."
      chat_url: "Legacy chat destination retained for migration compatibility."
  topic_author: "Author"