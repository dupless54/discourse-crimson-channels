brand_initial:
  type: string
  default: "S"

member_panel_title:
  type: string
  default: "ÇEVRİMİÇİ"

member_rail_enabled:
  type: bool
  default: true

member_rail_limit:
  type: integer
  default: 12
  min: 4
  max: 24

forum_width_percent:
  type: integer
  default: 100
  min: 40
  max: 100

visual_surface_style:
  type: enum
  default: "balanced"
  choices:
    - "balanced"
    - "flat"
    - "glass"

visual_accent_color:
  type: string
  default: "#5865f2"

visual_secondary_accent_color:
  type: string
  default: "#7c3aed"

visual_panel_opacity_percent:
  type: integer
  default: 94
  min: 72
  max: 100

visual_border_intensity_percent:
  type: integer
  default: 28
  min: 20
  max: 70

visual_glow_intensity_percent:
  type: integer
  default: 12
  min: 0
  max: 100

visual_corner_style:
  type: enum
  default: "soft"
  choices:
    - "compact"
    - "soft"
    - "rounded"

member_hover_card_enabled:
  type: bool
  default: true

member_hover_card_delay_seconds:
  type: integer
  default: 3
  min: 1
  max: 10

recent_profiles_enabled:
  type: bool
  default: true

recent_profiles_title:
  type: string
  default: "SON PROFİL ZİYARETÇİLERİ"

recent_profiles_limit:
  type: integer
  default: 12
  min: 4
  max: 24

featured_topic_lists:
  type: objects
  default: []
  schema:
    name: featured topic list
    properties:
      enabled:
        type: boolean
      title:
        type: string
        validations:
          max_length: 80
      category_ids:
        type: categories
        required: true
        validations:
          min: 1
          max: 1
      position:
        type: enum
        choices:
          - "above"
          - "below"
      limit:
        type: integer
        validations:
          min: 1
          max: 20

# v0.1.4 single-list settings are retained as a compatibility fallback. They
# are used only while featured_topic_lists is empty.
featured_topics_enabled:
  type: bool
  default: false

featured_category_url:
  type: string
  default: ""

featured_topics_title:
  type: string
  default: "SEÇİLİ KONULAR"

featured_topics_position:
  type: enum
  default: "above"
  choices:
    - "above"
    - "below"

featured_topics_limit:
  type: integer
  default: 5
  min: 1
  max: 20

navigation_items:
  type: objects
  default:
    - enabled: true
      label: "Ana sayfa"
      url: "/"
      icon: "house"
      style: "brand"
      visibility: "everyone"
      mobile_shortcut: false
    - enabled: true
      label: "Kategoriler"
      url: "/categories"
      icon: "list"
      style: "standard"
      visibility: "everyone"
      mobile_shortcut: false
    - enabled: true
      label: "Son konular"
      url: "/latest"
      icon: "clock"
      style: "standard"
      visibility: "everyone"
      mobile_shortcut: false
    - enabled: true
      label: "Private Serverlar"
      url: "/servers"
      icon: "server"
      style: "standard"
      visibility: "everyone"
      mobile_shortcut: true
    - enabled: true
      label: "Sohbet"
      url: "/chat"
      icon: "comments"
      style: "standard"
      visibility: "everyone"
      mobile_shortcut: false
  schema:
    name: navigation item
    identifier: label
    properties:
      enabled:
        type: boolean
      label:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 60
      url:
        type: string
        required: true
        validations:
          min_length: 1
          max_length: 2048
      icon:
        type: icon
        required: true
      style:
        type: enum
        choices:
          - "brand"
          - "standard"
      visibility:
        type: enum
        choices:
          - "everyone"
          - "groups"
      groups:
        type: groups
        resolve_group_membership: true
      mobile_shortcut:
        type: boolean

# Legacy single-link settings remain available for compatibility. Existing
# customized values are migrated into navigation_items during theme updates.
home_url:
  type: string
  default: "/"

categories_url:
  type: string
  default: "/categories"

latest_url:
  type: string
  default: "/latest"

servers_url:
  type: string
  default: "/servers"

chat_url:
  type: string
  default: "/chat"
